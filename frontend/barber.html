<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Barber · Kuya Pau's Barbershop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stripe"></div>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="barber.html">Kuya <b>Pau's</b> · Barber</a>
      <div style="flex:1"></div>
      <div class="who"><span class="muted small" id="b-name"></span><button class="btn ghost sm" id="logout">Logout</button></div>
    </div>
  </header>

  <main class="wrap">
    <section class="view active">
      <h2>My Dashboard</h2>

      <div class="card" style="margin-bottom:16px">
        <div class="inline" style="margin:0;align-items:center">
          <div><span class="muted small">Time in</span><div class="code" id="t-in">—</div></div>
          <div><span class="muted small">Time out</span><div class="code" id="t-out">—</div></div>
          <button class="btn primary" id="btn-timeout" style="flex:0 0 auto">Time out</button>
        </div>
        <p class="muted small" style="margin:10px 0 0">Time in is recorded when you log in. Time out only happens when you press the button. Logging out does not time you out.</p>
      </div>

      <div class="split even">
        <div class="card">
          <h3>My schedule</h3>
          <label>Date <input type="date" id="s-date"></label>
          <div id="slot-list"></div>
        </div>
        <div>
          <h3>Upcoming reservations</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>When</th><th>Customer</th><th>Service</th><th>Status</th></tr></thead>
              <tbody id="up-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">Kuya Pau's Barbershop since 2021</footer>
  <script src="js/api.js"></script>
  <script src="js/barber.js"></script>
</body>
</html>
